name: Build ML Kit GenAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Get official ML Kit sample
        run: git clone --depth 1 https://github.com/googlesamples/mlkit.git src

      - name: Build APK
        working-directory: src/android/genai
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MLKit-GenAI-debug-apk
          path: src/android/genai/app/build/outputs/apk/debug/app-debug.apk
